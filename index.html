<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ծախսերի հետեւող</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <h1 id="month"></h1>
    <p class="total" id="total"></p>
    <p class="sub" id="sub"></p>
    <div class="bar" id="bar" role="img" aria-label="Ծախսերի բաշխումն ըստ կատեգորիաների"></div>
    <ul class="cats" id="cats"></ul>

    <form id="form">
      <label>Գումար (֏)
        <input id="amt" type="number" min="1" step="1" inputmode="numeric" placeholder="2500" required>
      </label>
      <label>Կատեգորիա
        <select id="cat"></select>
      </label>
      <label class="full">Նշում
        <input id="note" type="text" maxlength="60" placeholder="Օրինակ՝ լավաշ և պանիր">
      </label>
      <button class="add full" type="submit">Ավելացնել ծախս</button>
    </form>

    <h2>Վերջին ծախսերը</h2>
    <ul class="list" id="list"></ul>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
